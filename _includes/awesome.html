<div class="d0-links-card">
  <div class="d0-links-header">Awesome Links!</div>
  <div class="d0-links-body">
    <div class="d0-links-sub">in alphabetical order (i think)</div>
    <div class="d0-tux-row">
      {% for i in (1..4) %}
      <img class="d0-spring" src="{{ '/img/tux.png' | relative_url }}" alt="Tux">
      {% endfor %}
    </div>
    <ul class="d0-links-list">
      {% for item in site.data.awesome %}
      <li><a href="{{ item.link }}" class="d0a-link" target="_blank" rel="noopener">{{ item.name }}</a></li>
      {% endfor %}
    </ul>
  </div>
</div>
<div class="d0-guestbook">
  <strong>sign my guestbook!</strong><br>tell me you were here &#9733;
  <div class="d0-guestbook-widget">
    <script src="https://giscus.app/client.js"
      data-repo="odjacobs/disc0.net"
      data-repo-id="R_kgDOHZX_Rw"
      data-mapping="number"
      data-term="1"
      data-reactions-enabled="1"
      data-emit-metadata="0"
      data-input-position="bottom"
      data-theme="preferred_color_scheme"
      data-lang="en"
      crossorigin="anonymous"
      async>
    </script>
  </div>
</div>
